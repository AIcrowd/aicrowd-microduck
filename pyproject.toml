[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicrowd-microduck"
version = "0.2.0"
description = "Validate, evaluate, pack and submit policies to the AIcrowd Microduck Sim2Real challenge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "onnxruntime>=1.17",  # validate runs the evaluator's own smoke inference on every graph
    "pyyaml>=6.0",        # the competition's task specs (local/competition/*.yaml)
    "toml>=0.10",
]

[project.optional-dependencies]
# `evaluate` simulates, and a trajectory depends on the exact simulator and inference builds, so this
# is the grader's stack pinned exactly (src/aicrowd_microduck/local/grader_stack.json, synced from the
# evaluator's lock; tests/test_local.py fails if the two disagree). Python 3.12, as the grader runs.
# The Microduck environments themselves come from the starter kit (or any package registering the v2 env ids).
sim = [
    "mjlab==1.3.0; python_version == '3.12'",
    "mujoco==3.12.0; python_version == '3.12'",
    "mujoco-warp==3.8.1; python_version == '3.12'",
    "warp-lang==1.12.0; python_version == '3.12'",
    "torch==2.9.1; python_version == '3.12'",
    "onnxruntime==1.29.0; python_version == '3.12'",
    "numpy==2.5.3; python_version == '3.12'",
    "scipy==1.18.1; python_version == '3.12'",
]

[project.scripts]
aicrowd-microduck = "aicrowd_microduck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrowd_microduck"]

[dependency-groups]
dev = [
    "onnx>=1.16",    # builds the tiny graphs the tests validate
    "pytest>=8",
    "pyyaml>=6.0",   # scripts/sync_from_evaluator.py reads the evaluator's task yamls
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# onnxruntime 1.24 ships no cp310 wheels. Fork the lock so the 3.10 CI job resolves too; pip does
# the same on its own, so the published metadata needs no marker.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]
