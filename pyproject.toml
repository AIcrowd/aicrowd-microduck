[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicrowd-microduck"
version = "0.2.0"
description = "Validate, evaluate, pack and submit policies to the AIcrowd Microduck Sim2Real challenge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "onnxruntime>=1.17",  # validate runs the evaluator's own smoke inference on every graph
    "pyyaml>=6.0",        # the competition's task specs (local/competition/*.yaml)
    "toml>=0.10",
]

[project.optional-dependencies]
# `evaluate` simulates: the grader's simulator stack. The Microduck environments themselves come from
# the starter kit (or any package registering the v2 env ids), which pins the rest of the stack.
sim = ["mjlab==1.3.0"]

[project.scripts]
aicrowd-microduck = "aicrowd_microduck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrowd_microduck"]

[dependency-groups]
dev = [
    "onnx>=1.16",    # builds the tiny graphs the tests validate
    "pytest>=8",
    "pyyaml>=6.0",   # scripts/sync_from_evaluator.py reads the evaluator's task yamls
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# onnxruntime 1.24 ships no cp310 wheels. Fork the lock so the 3.10 CI job resolves too; pip does
# the same on its own, so the published metadata needs no marker.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]
