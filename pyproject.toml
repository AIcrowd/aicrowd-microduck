[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicrowd-microduck"
version = "0.1.0"
description = "Validate, pack and submit policies to the AIcrowd Microduck Sim2Real challenge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "onnxruntime>=1.17",  # validate runs the evaluator's own smoke inference on every graph
    "toml>=0.10",
]

[project.scripts]
aicrowd-microduck = "aicrowd_microduck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrowd_microduck"]

[dependency-groups]
dev = [
    "onnx>=1.16",    # builds the tiny graphs the tests validate
    "pytest>=8",
    "pyyaml>=6.0",   # scripts/sync_from_evaluator.py reads the evaluator's task yamls
]

[tool.pytest.ini_options]
testpaths = ["tests"]
