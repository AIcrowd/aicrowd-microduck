# Flamingo Switch v2, level L1: stand / one-foot windows 1.75-2.5 s, no pushes, rigid floor.
# The level lives in the env (microduck_rl_training src/mjlab_microduck/tasks/v2/flamingo_switch.py LEVELS),
# with each episode's command schedule fixed at reset from (seed, env index). Score: flamingo_v2_score =
# max(0, mean over the 8 envs of the commanded-support score in [-2, 1]), read from the saved schedule over the
# full 10 s (docs/tasks/flamingo_switch.md §3, §7.2; metrics_v2/flamingo_switch.py).
task_id: flamingo_switch_v2_l1
family: flamingo_switch_v2
env_id: Mjlab-FlamingoSwitchV2-L1-MicroDuck
description: "Flamingo Switch v2, L1: alternate stand / one foot every 1.75-2.5 s, no pushes, rigid floor."
num_rollouts: 1
num_envs: 8
episode_length_s: 10.0
seed_mode: secret
action_scale: 1.0
step_deadline_s: 1.0
max_step_timeouts: 10
record_after_done_s: 0.5
metrics: [episode_length, survival, termination_reasons, reward_terms, trunk_height, env_metrics,
          flamingo_switch, flamingo_support_v2]
primary_metric: flamingo_v2_score
higher_is_better: true
eval_overrides:
  disable_curriculum: true
  terrain_rows: null
  terrain_cols: null
  terrain_curriculum: null
  disable_pushes: false
  disable_obs_noise: false
  disable_domain_randomization: false
render:
  enabled: true
  env_ids: [0]
  fps: 20
  width: 480
  height: 270
  shadows: false
  camera_distance: 1.0     # render-only framing: pulled back from 0.8 so the stage's front edge and curtain frame the duck
  camera_azimuth: 110.0    # the stage front faces -y; 110 shows it three-quarter on
  camera_elevation: -18.0
  scene: stage      # render-only: the duck on a wooden stage, deck top at the physics floor (server/decor_stage.py)
